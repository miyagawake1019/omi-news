<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻績村（おみむら）ゲームコーナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        omi: {
                            green: '#4ade80',
                            blue: '#60a5fa',
                            accent: '#fbbf24',
                        }
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        canvas {
            background: #f0fdf4;
            border: 4px solid #4ade80;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="text-slate-700 bg-green-50">

    <!-- Header -->
    <header class="fixed w-full top-0 z-50 bg-white/80 backdrop-blur-md shadow-sm border-b border-omi-green/20">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-600 flex items-center gap-2">
                <span class="text-3xl">🌱</span> 麻績村キッズニュース
            </h1>
            <nav class="hidden md:flex gap-6 font-bold text-slate-600">
                <a href="index.html" class="hover:text-green-600 transition">ニュース</a>
                <a href="#" class="hover:text-green-600 transition">村のいいところ</a>
                <a href="#" class="hover:text-green-600 transition">記者紹介</a>
                <a href="game.html" class="hover:text-green-600 transition text-orange-500">ゲーム</a>
                <a href="#" class="bg-green-500 text-white px-4 py-2 rounded-full hover:bg-green-600 transition shadow-md">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <!-- Game Section -->
    <section class="pt-32 pb-20 px-4 min-h-screen">
        <div class="container mx-auto text-center">
            <h2 class="text-3xl md:text-5xl font-black text-slate-800 mb-6">
                麻績村防衛隊！<br>
                <span class="text-green-500 text-2xl md:text-3xl">〜悪いやつらから村を守れ！〜</span>
            </h2>

            <div id="game-container" class="relative max-w-4xl mx-auto">
                <canvas id="gameCanvas" width="800" height="400" class="w-full h-auto bg-white"></canvas>

                <!-- Game UI -->
                <div class="mt-4 p-4 bg-white rounded-xl shadow-lg border-2 border-green-200">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-left">
                            <p class="text-sm text-slate-500">お財布 (Money)</p>
                            <p class="text-2xl font-black text-yellow-500" id="money-display">¥0</p>
                        </div>
                        <div class="text-right">
                             <p class="text-sm text-slate-500">基地の体力 (Base HP)</p>
                             <div class="w-32 h-4 bg-gray-200 rounded-full overflow-hidden">
                                 <div id="base-hp-bar" class="h-full bg-green-500 w-full transition-all duration-300"></div>
                             </div>
                        </div>
                    </div>

                    <!-- Unit Spawn Buttons -->
                    <div class="grid grid-cols-3 md:grid-cols-5 gap-2 mb-4">
                        <button id="spawn-normal" class="flex flex-col items-center justify-center p-2 rounded-lg bg-gray-100 hover:bg-gray-200 transition border-2 border-gray-300">
                            <span class="text-2xl">🐱</span>
                            <span class="text-xs font-bold">基本にゃん</span>
                            <span class="text-xs text-yellow-600">¥100</span>
                        </button>
                        <button id="spawn-tank" class="flex flex-col items-center justify-center p-2 rounded-lg bg-blue-50 hover:bg-blue-100 transition border-2 border-blue-200">
                            <span class="text-2xl">🛡️</span>
                            <span class="text-xs font-bold">カベにゃん</span>
                            <span class="text-xs text-yellow-600">¥300</span>
                        </button>
                        <button id="spawn-super" class="col-span-1 md:col-span-1 flex flex-col items-center justify-center p-2 rounded-lg bg-purple-50 hover:bg-purple-100 transition border-2 border-purple-200 ring-2 ring-yellow-400">
                            <span class="text-2xl">⚡</span>
                            <span class="text-xs font-bold">麻績の神</span>
                            <span class="text-xs text-yellow-600">¥1000</span>
                        </button>
                    </div>

                    <!-- Upgrades -->
                    <div class="grid grid-cols-2 gap-4 border-t pt-4 border-gray-100">
                        <button id="upgrade-wallet" class="flex items-center justify-center gap-2 p-3 rounded-lg bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold transition">
                            <span>💰</span> お財布レベルアップ (¥<span id="wallet-cost">500</span>)
                        </button>
                         <button id="upgrade-research" class="flex items-center justify-center gap-2 p-3 rounded-lg bg-red-100 hover:bg-red-200 text-red-800 font-bold transition">
                            <span>💪</span> 味方強化 (¥<span id="research-cost">1000</span>)
                        </button>
                    </div>
                </div>
            </div>

            <p class="mt-8 text-slate-500 text-sm">
                味方を出して、右から来る敵をやっつけよう！<br>
                お金を貯めて強力な「麻績の神」を呼び出そう！
            </p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-800 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-2xl font-bold mb-6 flex items-center justify-center gap-2">
                <span>🌱</span> 麻績村キッズニュース
            </h2>
            <div class="flex justify-center gap-6 mb-8 text-slate-300">
                <a href="index.html" class="hover:text-white transition">ホーム</a>
                <a href="index.html#news" class="hover:text-white transition">ニュース</a>
                <a href="#" class="hover:text-white transition">プライバシーポリシー</a>
            </div>
            <p class="text-slate-500 text-sm">
                &copy; 2023 Omi Village Kids News. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="js/game.js"></script>
</body>
</html>
